<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Stock — Design Exploration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,700;1,900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; padding:0; background:#E8E5DF; font-family:-apple-system,Inter,system-ui,sans-serif; color:#111; }
  * { box-sizing: border-box; }
  .canvas { min-height:100vh; padding: 48px 40px 120px; }
  .title { font-family:'Fraunces',Georgia,serif; font-weight:900; font-size:52px; letter-spacing:-1.5px; line-height:1; }
  .title i { font-style: italic; color:#7A6B56; }
  .sub { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:#4A4A52; margin-top:10px; max-width:820px; line-height:1.6; }
  .note { font-size:13px; color:#3A3A42; margin-top:14px; max-width:780px; line-height:1.55; }
  .kvs { display:flex; gap:28px; margin-top:20px; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1.3px; color:#6a665c; text-transform:uppercase; }
  .kvs b { color:#111; font-weight:700; }
  .group { margin-top:56px; }
  .group-head { display:flex; align-items:baseline; gap:16px; margin-bottom: 24px; }
  .group-num { font-family:'JetBrains Mono',monospace; font-size:12px; color:#8a8575; letter-spacing:2px; }
  .group-name { font-family:'Fraunces',serif; font-style:italic; font-weight:700; font-size:28px; letter-spacing:-0.5px; }
  .group-desc { font-size:12px; color:#555; max-width:560px; line-height:1.55; margin-left:auto; }
  .row { display:flex; gap:24px; flex-wrap:wrap; }
  .col { display:flex; flex-direction:column; gap:10px; align-items:center; }
  .col-label { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1.5px; color:#6a665c; text-transform:uppercase; }
  .phone-wrap { position:relative; }
  .tweaks { position:fixed; bottom:20px; right:20px; background:#14171E; color:#fff; padding:14px 16px; border-radius:14px; display:none; flex-direction:column; gap:10px; z-index:100; box-shadow:0 20px 40px rgba(0,0,0,.3); font-family:'Inter',system-ui,sans-serif; font-size:12px; min-width:220px; }
  .tweaks.on { display:flex; }
  .tweaks h4 { margin:0 0 4px; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:#aaa; font-weight:600; }
  .tweaks .seg { display:flex; background:#24272E; border-radius:8px; overflow:hidden; }
  .tweaks .seg button { flex:1; background:transparent; color:#aaa; border:none; padding:6px 8px; font-size:11px; font-weight:600; cursor:pointer; font-family:inherit; }
  .tweaks .seg button.on { background:#E85D04; color:#fff; }
  hr { border:none; border-top:1px solid #D4CCB9; margin: 40px 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components/ios-frame.jsx"></script>
<script type="text/babel" src="components/icons.jsx"></script>
<script type="text/babel" src="components/mockdata.jsx"></script>
<script type="text/babel" src="components/direction-a.jsx"></script>
<script type="text/babel" src="components/direction-b.jsx"></script>
<script type="text/babel" src="components/direction-c.jsx"></script>

<script type="text/babel" data-presets="react">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "direction": "all",
  "density": "normal"
}/*EDITMODE-END*/;

function Phone({ dark, children, label }) {
  return (
    <div className="col">
      <div className="phone-wrap" data-screen-label={label}>
        <IOSDevice width={360} height={760} dark={dark}>
          {children}
        </IOSDevice>
      </div>
      <div className="col-label">{label}</div>
    </div>
  );
}

function DirectionGroup({ num, name, desc, bgSwatches, children }) {
  return (
    <div className="group">
      <div className="group-head">
        <div className="group-num">DIR·{num}</div>
        <div className="group-name">{name}</div>
        <div className="group-desc">{desc}</div>
      </div>
      <div style={{ display: 'flex', gap: 8, marginBottom: 24 }}>
        {bgSwatches.map((s, i) => (
          <div key={i} style={{ display:'flex', alignItems:'center', gap:6, fontFamily:'JetBrains Mono, monospace', fontSize:10, color:'#4A4A52', letterSpacing:1 }}>
            <div style={{ width:16, height:16, background:s.c, border:'1px solid rgba(0,0,0,0.1)', borderRadius:3 }}/>
            <span>{s.n}</span>
          </div>
        ))}
      </div>
      <div className="row">{children}</div>
    </div>
  );
}

function App() {
  const [state, setState] = React.useState(TWEAK_DEFAULTS);
  const [editMode, setEditMode] = React.useState(false);

  React.useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === '__activate_edit_mode') setEditMode(true);
      if (e.data?.type === '__deactivate_edit_mode') setEditMode(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const update = (k, v) => {
    const next = { ...state, [k]: v };
    setState(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  const show = (d) => state.direction === 'all' || state.direction === d;

  return (
    <>
      <div className="canvas">
        <div style={{ maxWidth: 1400, margin: '0 auto' }}>
          <div style={{ fontFamily:'JetBrains Mono,monospace', fontSize:11, letterSpacing:2, color:'#6a665c', textTransform:'uppercase' }}>stock · mobile redesign</div>
          <h1 className="title">Three directions <i>to consider.</i></h1>
          <div className="sub">Four screens · three aesthetic territories · same functional surface</div>
          <div className="note">
            I read the full codebase and studied the patterns that aren't working: cards floating on cards, a gradient header that fights the orange accent, quick-actions grids that feel generic, numbers that don't earn their size. These three directions push from "refined same" to "deeply different" — enough variance that you can identify what's yours and kill the rest. Each covers the four highest-traffic surfaces: <b>Dashboard</b>, <b>Stock (manager)</b>, <b>Stock (staff quick-withdraw)</b>, and <b>Requests</b>.
          </div>
          <div className="kvs">
            <span><b>A</b> · Refined current — same DNA, tightened</span>
            <span><b>B</b> · Warehouse paper — editorial, tactile, ledger</span>
            <span><b>C</b> · Night ops — dark-first, HUD discipline</span>
          </div>

          {show('a') && (
            <DirectionGroup
              num="A"
              name="Refined Current"
              desc="Same slate+orange DNA, disciplined. Flat dark panel replaces the blue gradient. Orange gets an accent stripe. Numbers get real typography. Cards thin out; dividers do the hierarchy work. Safest ship — feels like a mature v2 of what you have."
              bgSwatches={[
                { c:'#F6F4F0', n:'Paper warm' },
                { c:'#14171E', n:'Near-black' },
                { c:'#E85D04', n:'Orange' },
              ]}
            >
              <Phone label="01 Dashboard"><A_Dashboard density={state.density}/></Phone>
              <Phone label="02 Stock — Manager"><A_StockManager density={state.density}/></Phone>
              <Phone label="03 Stock — Staff"><A_StockStaff/></Phone>
              <Phone label="04 Requests"><A_Requests/></Phone>
            </DirectionGroup>
          )}

          {show('b') && (
            <DirectionGroup
              num="B"
              name="Warehouse Paper"
              desc="Editorial masthead on every screen. Warm paper, black ink, a Fraunces display face for numbers and titles, JetBrains Mono for data. Stock rows read like a proper ledger. Status pills become ink-stamps. Kitchen withdraw becomes a physical stamp button. Ships identity — feels unmistakably yours, but you'll lose some data density."
              bgSwatches={[
                { c:'#F1EDE3', n:'Paper' },
                { c:'#1A1916', n:'Ink' },
                { c:'#C23B1F', n:'Stamp red' },
                { c:'#E6D486', n:'Tape' },
              ]}
            >
              <Phone label="01 Dashboard"><B_Dashboard/></Phone>
              <Phone label="02 Stock — Manager"><B_StockManager/></Phone>
              <Phone label="03 Stock — Staff"><B_StockStaff/></Phone>
              <Phone label="04 Requests"><B_Requests/></Phone>
            </DirectionGroup>
          )}

          {show('c') && (
            <DirectionGroup
              num="C"
              name="Night Ops"
              desc="Dark-first. Sodium amber replaces orange as the brand accent; oxblood for alerts; glowing dots for status. Reads like a dispatch console — made for warehouses, late shifts, low light. Kitchen button becomes a live-fire action bar. More opinionated than A, more data-forward than B."
              bgSwatches={[
                { c:'#0A0B0D', n:'Ink void' },
                { c:'#191C21', n:'Panel' },
                { c:'#FFB020', n:'Sodium' },
                { c:'#C73E3E', n:'Oxblood' },
              ]}
            >
              <Phone label="01 Dashboard"><C_Dashboard/></Phone>
              <Phone label="02 Stock — Manager"><C_StockManager/></Phone>
              <Phone label="03 Stock — Staff"><C_StockStaff/></Phone>
              <Phone label="04 Requests"><C_Requests/></Phone>
            </DirectionGroup>
          )}

          <hr/>
          <div style={{ fontFamily:'Fraunces,serif', fontStyle:'italic', fontWeight:700, fontSize:22, letterSpacing:-0.3, marginBottom: 10 }}>My read, if you want one</div>
          <div className="note" style={{ maxWidth: 920 }}>
            If this is a <b>polish pass</b>, ship <b>A</b>. Same bones, no retraining, but the app finally feels premium. The one move I'd insist on even in A: replace the blue gradient with the flat near-black + orange stripe — it fixes the identity crisis in one stroke.
            <br/><br/>
            If you want the app to have a <b>voice</b>, take <b>B</b>. Stock apps almost always look like generic SaaS; B looks like a thing made for people who work with physical inventory. High risk, high reward.
            <br/><br/>
            If the primary user is on a <b>warehouse or kitchen floor</b> at night, under bad lighting, stressed — <b>C</b> is the right answer. It's the only one that treats the app like a tool and not a dashboard.
            <br/><br/>
            Hybrid I'd actually ship: <b>A's structure</b> + <b>B's typography for numbers</b> + <b>C's status dot system</b>. Happy to build that as a fourth direction if you want.
          </div>
        </div>
      </div>

      <div className={`tweaks ${editMode ? 'on' : ''}`}>
        <h4>Tweaks</h4>
        <div>
          <div style={{ color:'#888', fontSize:10, marginBottom:4, letterSpacing:1 }}>DIRECTION</div>
          <div className="seg">
            {['all','a','b','c'].map(d => (
              <button key={d} className={state.direction===d ? 'on' : ''} onClick={() => update('direction', d)}>{d.toUpperCase()}</button>
            ))}
          </div>
        </div>
        <div>
          <div style={{ color:'#888', fontSize:10, marginBottom:4, letterSpacing:1 }}>DENSITY</div>
          <div className="seg">
            {['compact','normal'].map(d => (
              <button key={d} className={state.density===d ? 'on' : ''} onClick={() => update('density', d)}>{d}</button>
            ))}
          </div>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
