<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Stock — Extras (Warehouse Paper)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,700;1,900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#E8E5DF;font-family:Inter,system-ui,sans-serif}
  *{box-sizing:border-box}
  .canvas{padding:48px 40px 120px}
  .title{font-family:'Fraunces',serif;font-weight:900;font-size:52px;letter-spacing:-1.5px;line-height:1}
  .title i{font-style:italic;color:#7A6B56}
  .sub{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#4A4A52;margin-top:10px;max-width:820px;line-height:1.6}
  .row{display:flex;gap:24px;flex-wrap:wrap;margin-top:40px}
  .col{display:flex;flex-direction:column;gap:10px;align-items:center}
  .col-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;color:#6a665c;text-transform:uppercase}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="components/ios-frame.jsx"></script>
<script type="text/babel" src="components/icons.jsx"></script>
<script type="text/babel" src="components/mockdata.jsx"></script>
<script type="text/babel" src="components/direction-b.jsx"></script>
<script type="text/babel" src="components/direction-b-extras.jsx"></script>
<script type="text/babel" data-presets="react">
function Phone({children,label}){return(<div className="col" data-screen-label={label}><IOSDevice width={360} height={760}>{children}</IOSDevice><div className="col-label">{label}</div></div>);}
function App(){return(<div className="canvas"><div style={{maxWidth:1500,margin:'0 auto'}}>
  <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:11,letterSpacing:2,color:'#6a665c',textTransform:'uppercase'}}>warehouse paper · linked screens</div>
  <h1 className="title">The rest of the <i>Stockroom.</i></h1>
  <div className="sub">Five screens that currently still ship the old design. All re-drawn in the Warehouse Paper system so nothing feels out of place.</div>
  <div className="row">
    <Phone label="05 Place an order"><D_PlaceOrder/></Phone>
    <Phone label="06 Request detail"><D_RequestDetail/></Phone>
    <Phone label="07 Stock take"><D_StockTake/></Phone>
    <Phone label="08 Transfer stock"><D_Transfer/></Phone>
    <Phone label="09 More menu"><D_More/></Phone>
  </div>
</div></div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
