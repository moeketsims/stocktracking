<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Stock — Wave 3 (Warehouse Paper)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,700;1,900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#E8E5DF;font-family:Inter,system-ui,sans-serif;color:#1C1915}
  *{box-sizing:border-box}
  .canvas{padding:44px 40px 120px;max-width:1780px;margin:0 auto}
  .kicker{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2.2px;color:#6A665C;text-transform:uppercase}
  .title{font-family:'Fraunces',serif;font-weight:900;font-size:56px;letter-spacing:-1.6px;line-height:1;margin:8px 0 10px}
  .title i{font-style:italic;color:#7A6B56}
  .sub{font-family:'Fraunces',serif;font-style:italic;font-size:18px;letter-spacing:-0.2px;color:#3a362d;max-width:820px;line-height:1.5}
  .section{margin-top:56px;padding-top:24px;border-top:1.5px solid #B9B0A0}
  .section-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .section-title{font-family:'Fraunces',serif;font-style:italic;font-weight:900;font-size:30px;letter-spacing:-0.6px}
  .section-num{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#6A665C}
  .section-desc{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.2px;color:#6A665C;margin-top:6px;max-width:700px;line-height:1.6;text-transform:uppercase}
  .row{display:flex;gap:28px;flex-wrap:wrap;margin-top:22px}
  .col{display:flex;flex-direction:column;gap:10px;align-items:center}
  .col-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;color:#4A4A52;text-transform:uppercase;font-weight:600}
  .col-sub{font-family:'Fraunces',serif;font-style:italic;font-size:13px;color:#6A665C;max-width:280px;text-align:center;line-height:1.3}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="components/ios-frame.jsx"></script>
<script type="text/babel" src="components/icons.jsx"></script>
<script type="text/babel" src="components/mockdata.jsx"></script>
<script type="text/babel" src="components/direction-b.jsx"></script>
<script type="text/babel" src="components/direction-b-extras.jsx"></script>
<script type="text/babel" src="components/direction-b-login.jsx"></script>
<script type="text/babel" src="components/wp-primitives.jsx"></script>
<script type="text/babel" src="components/wp-trips.jsx"></script>
<script type="text/babel" src="components/wp-loans.jsx"></script>
<script type="text/babel" src="components/wp-utility.jsx"></script>
<script type="text/babel" src="components/wp-mgmt.jsx"></script>
<script type="text/babel" src="components/wp-reports.jsx"></script>
<script type="text/babel" data-presets="react">
function Phone({children,label,sub}){
  return (
    <div className="col" data-screen-label={label}>
      <IOSDevice width={360} height={760}>{children}</IOSDevice>
      <div className="col-label">{label}</div>
      {sub && <div className="col-sub">{sub}</div>}
    </div>
  );
}
function Section({num,title,desc,children}){
  return (
    <div className="section" data-screen-label={`${num} ${title}`}>
      <div className="section-head">
        <div className="section-num">{num}</div>
        <div className="section-title">{title}</div>
      </div>
      {desc && <div className="section-desc">{desc}</div>}
      <div className="row">{children}</div>
    </div>
  );
}

function App(){
  return (
    <div className="canvas">
      <div className="kicker">Warehouse Paper · Wave 3</div>
      <h1 className="title">The rest of the <i>Stockroom,</i> finished.</h1>
      <div className="sub">Every remaining screen of Potato Stock — trips, loans, management, reports, utilities — redrawn in the Warehouse Paper system so nothing in the app still feels like the old design.</div>

      <Section num="01" title="Trips" desc="Dispatch log · vehicle-centric trip record · new-trip form. Driver + vehicle are first-class on every row.">
        <Phone label="1.1 Trips list"       sub="Summary band, tab strip, numbered vouchers."><W_TripsList/></Phone>
        <Phone label="1.2 Trip detail"      sub="Vehicle + driver card, manifest, action stack."><W_TripDetail/></Phone>
        <Phone label="1.3 New trip"         sub="Form with route selector and manifest editor."><W_TripCreate/></Phone>
      </Section>

      <Section num="02" title="Loans" desc="Borrow stock between locations — request, approval state, history.">
        <Phone label="2.1 Loans list"       sub="Pending / approved / returned, chip-filtered."><W_LoansList/></Phone>
        <Phone label="2.2 Loan detail"      sub="Party-A/party-B split, return schedule."><W_LoanDetail/></Phone>
        <Phone label="2.3 New loan"         sub="Pick lender, items, due date."><W_LoanCreate/></Phone>
      </Section>

      <Section num="03" title="Utilities" desc="Notifications, settings, scanner permission, and sign-in — the app's framing surfaces.">
        <Phone label="3.1 Notifications"    sub="Today / earlier, coloured spine per kind."><W_Notifications/></Phone>
        <Phone label="3.2 Settings"         sub="Grouped preferences with paper toggles."><W_Settings/></Phone>
        <Phone label="3.3 Scan permission"  sub="Illustrated explainer before camera prompt."><W_ScanPermissionV2/></Phone>
        <Phone label="3.4 Sign in"          sub="From Wave 2 — Ledger variation, production."><D_Login_Ledger/></Phone>
      </Section>

      <Section num="04" title="Management — lists" desc="Every roster in the app, rendered as the same numbered ledger so adding a new entity type costs zero design work.">
        <Phone label="4.1 Drivers"          sub="Licenses tracked; expiring + expired stamps."><W_DriversList/></Phone>
        <Phone label="4.2 Users"            sub="Admin / manager / staff, invite flow."><W_UsersList/></Phone>
        <Phone label="4.3 Vehicles"         sub="Plate · model · capacity · fuel."><W_VehiclesList/></Phone>
        <Phone label="4.4 Locations"        sub="Type + zone + current stock health."><W_LocationsList/></Phone>
        <Phone label="4.5 Zones"            sub="Managed regions — manager + location count."><W_ZonesList/></Phone>
        <Phone label="4.6 Suppliers"        sub="Contact + batch count."><W_SuppliersList/></Phone>
      </Section>

      <Section num="05" title="Management — record + create" desc="Driver is the exemplar; same layout serves users, vehicles, locations, zones, suppliers.">
        <Phone label="5.1 Driver record"    sub="Voucher-card top, stats band, action stack."><W_DriverDetail/></Phone>
        <Phone label="5.2 Invite driver"    sub="Mono inputs + date-stamp fields + primary bar."><W_DriverCreate/></Phone>
      </Section>

      <Section num="06" title="Reports" desc="Statistics department — hub plus four canonical reports. Paper-native bar charts built from hairline cells.">
        <Phone label="6.1 Reports hub"      sub="Period selector + summary + report library."><W_ReportsHub/></Phone>
        <Phone label="6.2 Stock movement"   sub="Bags in/out, weekly chart, top routes."><W_ReportMovement/></Phone>
        <Phone label="6.3 Orders"           sub="Placed, fulfilled, by-zone ticker bars."><W_ReportOrders/></Phone>
        <Phone label="6.4 Losses"           sub="Shrink %, cause share, incident log."><W_ReportLosses/></Phone>
        <Phone label="6.5 Trips"            sub="Driver leaderboard — bags moved."><W_ReportTrips/></Phone>
      </Section>

      <div className="section">
        <div className="section-head">
          <div className="section-num">99</div>
          <div className="section-title">What's new under the hood</div>
        </div>
        <div className="section-desc">
          components/wp-primitives.jsx introduces WMasthead, WStamp, WIntentStrip, WFieldBox, WPrimaryBar, WBottomTabs, WVoucher, WLedgerRow, WSummaryBand, WChipStrip, WTabStrip, WToggle, WTickerBar, WMonoInput, WActionStack — shared across every Wave-3 screen so layouts stay disciplined and tweaks propagate globally.
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
