<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Stock — Login (Warehouse Paper)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,700;1,900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#E8E5DF;font-family:Inter,system-ui,sans-serif}
  *{box-sizing:border-box}
  .canvas{padding:48px 40px 120px}
  .title{font-family:'Fraunces',serif;font-weight:900;font-size:52px;letter-spacing:-1.5px;line-height:1}
  .title i{font-style:italic;color:#7A6B56}
  .sub{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#4A4A52;margin-top:10px;max-width:820px;line-height:1.6}
  .row{display:flex;gap:40px;flex-wrap:wrap;margin-top:40px;justify-content:flex-start}
  .col{display:flex;flex-direction:column;gap:12px;align-items:center}
  .col-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;color:#6a665c;text-transform:uppercase;max-width:360px;text-align:center;line-height:1.5}
  .col-label b{display:block;font-family:'Fraunces',serif;font-style:italic;font-weight:900;font-size:20px;letter-spacing:-0.5px;color:#1A1916;margin-bottom:6px;text-transform:none}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="components/ios-frame.jsx"></script>
<script type="text/babel" src="components/icons.jsx"></script>
<script type="text/babel" src="components/mockdata.jsx"></script>
<script type="text/babel" src="components/direction-b.jsx"></script>
<script type="text/babel" src="components/direction-b-login.jsx"></script>
<script type="text/babel" data-presets="react">
function Phone({children, title, desc, label}){return(<div className="col" data-screen-label={label}><IOSDevice width={360} height={760}>{children}</IOSDevice><div className="col-label"><b>{title}</b>{desc}</div></div>);}
function App(){return(<div className="canvas"><div style={{maxWidth:1500,margin:'0 auto'}}>
  <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:11,letterSpacing:2,color:'#6a665c',textTransform:'uppercase'}}>warehouse paper · sign in</div>
  <h1 className="title">The <i>door.</i></h1>
  <div className="sub">Three ways to let someone into the Stockroom. All three use the Warehouse Paper system — italic wordmark, mono fields, ink buttons — but lean into different metaphors.</div>
  <div className="row">
    <Phone label="01 Voucher" title="01 · Voucher"  desc="Entry-pass card centered on paper. Safest / most literal of the three — maps closest to the current card-on-background layout, so the fewest surprises.">
      <D_Login_Voucher/>
    </Phone>
    <Phone label="02 Ledger" title="02 · Ledger"    desc="Field-only. No card — just ruled lines on paper with a big italic headline. The most editorial. Best if we want the login to feel like a stamped arrival in a logbook.">
      <D_Login_Ledger/>
    </Phone>
    <Phone label="03 Parcel" title="03 · Parcel"    desc="The app as a shipping package: masking tape, address-block fields, postmark, colored CTA. The most playful — leans hardest into the warehouse metaphor.">
      <D_Login_Parcel/>
    </Phone>
  </div>

  <div style={{marginTop:60,paddingTop:24,borderTop:'1.5px solid #1A1916',maxWidth:820}}>
    <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:10,letterSpacing:2,color:'#6a665c',textTransform:'uppercase'}}>recommendation</div>
    <div style={{fontFamily:'Fraunces',fontStyle:'italic',fontWeight:900,fontSize:28,letterSpacing:-0.5,marginTop:6,lineHeight:1.15}}>
      <b style={{fontWeight:900}}>02 Ledger</b> for production. It's the cleanest, fastest to tap, and the most consistent with the other screens (dashboard, requests, stock-take all open with a masthead-first layout). <b style={{fontWeight:900}}>03 Parcel</b> is a better splash/welcome, if you want a first-run moment.
    </div>
  </div>
</div></div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
