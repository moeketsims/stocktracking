name: Mobile Android Release

on:
  workflow_dispatch:
    inputs:
      submit_to_play:
        description: "Submit the production build to the Google Play internal track"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: mobile-android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Must match eas.json's production env. Both Heroku domains currently
      # serve the same deployment, so the drift was harmless — but the
      # pre-flight export would have been checking a different URL than the one
      # EAS compiles into the binary, which is exactly the gap you don't want
      # a release check to have.
      EXPO_PUBLIC_API_URL: https://stocktracker-0560a415bf9e.herokuapp.com
      EXPO_EAS_PROJECT_ID: 412d6a6e-d94f-4a14-adce-779b409be29a

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Expo dependency compatibility
        run: npm run deps:check

      - name: Expo project doctor
        run: npm run doctor

      - name: Unit tests
        run: npm run test:ci

      - name: Android bundle export
        run: npm run export:android

      - name: Build production Android App Bundle
        run: npx eas-cli build --platform android --profile production --non-interactive

  submit:
    name: Submit To Google Play
    runs-on: ubuntu-latest
    needs: build
    if: inputs.submit_to_play == 'true'
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Submit latest production build to Play internal track
        run: npx eas-cli submit --platform android --profile production --latest --non-interactive
